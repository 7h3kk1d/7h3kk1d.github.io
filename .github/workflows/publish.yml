name: Deploy

on:
  push:
    branches:
      - dev
  # Run by hand after publishing to 7h3kk1d/talks, whose slides are copied in below.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Talk slides are built elsewhere and kept out of this repo; /talks/ itself
      # is the Astro page, so only the talk folders are copied in.
      - name: Check out talk slides
        uses: actions/checkout@v4
        with:
          repository: 7h3kk1d/talks
          path: talks-repo

      - name: Add talk slides
        run: |
          for d in talks-repo/*/; do
            cp -R "$d" "dist/talks/$(basename "$d")"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./dist
          publish_branch: master
